name: igac_segmentation
channels:
  - conda-forge
  - pytorch
  - nvidia
  - defaults

dependencies:
  # Python
  - python=3.10

  # PyTorch with CUDA 12.1 (optimizado para RTX 4060)
  - pytorch=2.3.*
  - torchvision=0.18.*
  - pytorch-cuda=12.1

  # Geospatial
  - geopandas=0.13.2
  - rasterio=1.3.8
  - fiona=1.9.4
  - shapely
  - pyproj
  - rtree
  - mapclassify

  # Data Science Core
  - numpy
  - pandas
  - scipy
  - scikit-learn>=1.4
  - scikit-image
  - opencv

  # Visualization
  - matplotlib
  - seaborn
  - plotly

  # Jupyter
  - jupyterlab=4.0
  - ipykernel
  - ipywidgets=8.0

  # Utilities
  - pip
  - tqdm
  - pyyaml
  - pillow

  # Development (opcional)
  - black=23.7
  - pytest
  - pytest-cov

  # Pip dependencies (paquetes no disponibles en conda)
  - pip:
      # Segmentation Models (CORE)
      - segmentation-models-pytorch==0.3.3
      - albumentations==1.3.1
      - pretrainedmodels==0.7.4
      - efficientnet-pytorch==0.7.1

      # TensorBoard
      - tensorboard==2.15.1
      - tensorboardX==2.6.2.2

      # Transformers (para SegFormer, opcional)
      - transformers==4.36.0
      - timm==0.9.12

      # Metrics
      - torchmetrics==1.2.1

      # Augmentation adicional
      - imgaug==0.4.0

      # Config management
      - python-dotenv==1.0.0
      - omegaconf==2.3.0
